<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>小雅刷课助手</title></head>
<body>
  <header><img class="brand" src="icons/icon128.png" alt=""><div class="brand-copy"><h1>小雅刷课助手</h1></div><span class="version">v0.2.1</span></header>
  <main>
    <div class="preferences">
    <label class="setting">视频速度<select id="rate"><option value="1">1 倍</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2" selected>2 倍</option></select></label>
    <div class="setting">课件停留时间<span class="automatic">自动读取任务要求</span></div>
    <label class="toggle"><input id="background" type="checkbox" checked>后台继续学习</label>
    <label class="toggle"><input id="muted" type="checkbox">静音自动播放</label>
    <label class="toggle"><input id="autoNext" type="checkbox" checked>完成后自动下一任务</label>
    <label class="toggle"><input id="recursive" type="checkbox" checked>课程内包含子章节</label>
    </div>
    <p class="hint">保留一个小雅标签页，即可使用其他网页。运行时请勿刷新或关闭小雅页，计时以平台为准。</p>
    <button id="scan" class="scan">获取待完成任务</button>
    <div class="actions"><button id="start">开始队列</button><button id="stop" class="secondary">停止</button></div>
    <section aria-live="polite"><div class="status-head">运行状态 <span id="count">0 项</span></div><p id="status">尚未开始</p><ol id="logs"></ol></section>
    <section><div class="status-head">可处理待办 <span id="task-count">0 项</span></div><ul id="tasks"></ul></section>
  </main><script src="popup.js"></script>
</body></html>
